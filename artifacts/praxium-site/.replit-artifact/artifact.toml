kind = "web"
previewPath = "/"
title = "PraxiumAI"
version = "1.0.0"
id = "artifacts/praxium-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18304

[services.development]
run = "pnpm --filter @workspace/praxium-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/praxium-site", "run", "build" ]
publicDir = "artifacts/praxium-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18304"
BASE_PATH = "/"
